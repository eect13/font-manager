<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Atrium — personal command center</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/app.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect rx='8' width='32' height='32' fill='%23e2b657'/><text x='16' y='22' text-anchor='middle' font-size='16' font-family='serif' fill='%231a1408'>A</text></svg>" />
</head>
<body>
  <a href="../" style="position:fixed;top:10px;right:14px;z-index:50;font:500 12px/1 IBM Plex Sans,system-ui,sans-serif;color:#1a1408;background:#e2b657;padding:8px 12px;border-radius:999px;text-decoration:none">← Studio</a>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="mark">A</div>
        <div>
          <h1>Atrium</h1>
          <p>Command center</p>
        </div>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="side-foot">
        Local-first · modular
        <div class="who">Asia/Manila · data stays in this browser</div>
      </div>
    </aside>
    <div class="main">
      <header class="topbar">
        <div class="title" id="view-title">Dashboard</div>
        <div class="grow"></div>
        <label class="search">
          <span>⌘K</span>
          <input id="omni" type="search" placeholder="Lunch Friday 1pm · note: buy rice · spend 500 Grab" />
        </label>
        <div class="clock-chip" id="live-clock">—</div>
        <button class="icon-btn" id="theme-btn" title="Toggle theme">◐</button>
      </header>
      <main class="view" id="view"></main>
    </div>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
